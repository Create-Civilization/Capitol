modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
mandatory = true
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "create"
type = "optional"
versionRange = "[6.0.9,6.1.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "sable"
type = "optional"
versionRange = "[1.1.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "journeymap"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "simulated"
type = "optional"
versionRange = "[1.1.3,)"
ordering = "NONE"
side = "BOTH"

[[mixins]]
config="capitol.mixins.json"