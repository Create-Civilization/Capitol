name: Bug Report
description: "Report a bug with Capitol."
labels: [ "type: bug" ]
body:
  - type: textarea
    attributes:
      label: Description
      description: >
        Describe the issue, what happened, and what you expected instead.
        Include images or videos if helpful.
    validations:
      required: true
  - type: input
    attributes:
      label: Game Log
      description: >
        Upload your "logs/latest.log" file to https://mclo.gs/ and paste the link here.
        Do **not** paste the file contents directly.
    validations:
      required: true
